[workspace]
resolver = "3"
members = ["crates/android-driver-core", "crates/android-driver"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
incremental = false
debug = "line-tables-only"

[profile.dev.package."*"]
debug = 0

[profile.release]
strip = true